# UwUbuntu lock screen (Super+L in Hyprland)
background {
    path = /usr/share/backgrounds/uwubuntu/uwubuntu-night.png
    blur_passes = 3
    brightness = 0.7
}

label {
    text = $TIME
    color = rgba(f7ede8ff)
    font_size = 72
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = (=^·ω·^=)  welcome back, $USER
    color = rgba(f4a27cff)
    font_size = 18
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    size = 320, 54
    outline_thickness = 3
    outer_color = rgba(e14908ff)
    inner_color = rgba(2b1610ee)
    font_color = rgba(f7ede8ff)
    check_color = rgba(ffc66bff)
    fail_color = rgba(e0533aff)
    placeholder_text = password, pawtner
    rounding = 18
    position = 0, -40
    halign = center
    valign = center
}
