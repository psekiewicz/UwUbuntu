# UwUbuntu Hyprland config. It's yours now: edit away!
# Docs: https://wiki.hypr.land/Configuring/

$mod      = SUPER
$terminal = kitty
$files    = nautilus
$menu     = wofi --show drun

monitor = , preferred, auto, 1

# --- Autostart ----------------------------------------------------------------
exec-once = swaybg -m fill -i /usr/share/backgrounds/uwubuntu/uwubuntu-night.png
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = hyprctl setcursor Yaru 24
exec-once = uwu-welcome --autostart

env = XCURSOR_THEME,Yaru
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb

# --- Look ---------------------------------------------------------------------
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 3
    col.active_border = rgba(e14908ff) rgba(f4835aff) rgba(ffc66bff) 45deg
    col.inactive_border = rgba(5a2a12aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(1a0b06cc)
    }

    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.2
    }
}

# Bouncy, springy, everything moves (=^·ω·^=)
animations {
    enabled = true
    bezier = bounce, 0.68, -0.55, 0.27, 1.55
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    bezier = snappy, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 6, bounce, popin 70%
    animation = windowsOut, 1, 5, smooth, popin 70%
    animation = windowsMove, 1, 5, snappy
    animation = fade, 1, 6, smooth
    animation = border, 1, 10, smooth
    animation = borderangle, 1, 80, smooth, loop
    animation = workspaces, 1, 6, bounce, slidevert
    animation = layers, 1, 5, snappy, popin 80%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# --- Input --------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# three-finger swipe between workspaces
gesture = 3, horizontal, workspace

# --- Keys ---------------------------------------------------------------------
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, Space, exec, $menu
bind = $mod, E, exec, $files
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, M, exit

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.2 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
