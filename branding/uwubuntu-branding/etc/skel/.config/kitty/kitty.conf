# UwUbuntu kitty defaults ("Ember" theme).
# Your own copy: edit freely. UwU Settings → Terminal opens it.

font_size               11.5
window_padding_width    10
background_opacity      0.92
background_blur         24
cursor_shape            beam
cursor_trail            3
cursor_trail_decay      0.1 0.4
confirm_os_window_close 0
enable_audio_bell       no
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round

foreground              #f7ede8
background              #2b1610
selection_foreground    #2b1610
