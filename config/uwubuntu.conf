# UwUbuntu build configuration. Sourced by build.sh (bash syntax).

# --- Identity -----------------------------------------------------------------
DISTRO_NAME="UwUbuntu"
DISTRO_ID="uwubuntu"
DISTRO_VERSION="26.04"
DISTRO_VERSION_SUFFIX=" LTS"           # empty for interim releases
DISTRO_CODENAME_PRETTY="Fluffy Raccoon"
DISTRO_HOME_URL="https://github.com/psekiewicz/UwUbuntu"
DISTRO_SUPPORT_URL="https://github.com/psekiewicz/UwUbuntu/discussions"
DISTRO_BUG_URL="https://github.com/psekiewicz/UwUbuntu/issues"

# --- Upstream base ------------------------------------------------------------
# resolute = Ubuntu 26.04 LTS (supported until 2031)
# stonking = Ubuntu 26.10 (newest, 9 months of support)
UBUNTU_SUITE="resolute"
UBUNTU_MIRROR="http://archive.ubuntu.com/ubuntu"
UBUNTU_SECURITY_MIRROR="http://security.ubuntu.com/ubuntu"
ARCH="amd64"

# --- Extras -------------------------------------------------------------------
# github.com/ryanoasis/nerd-fonts release for JetBrainsMono Nerd Font (kitty's font)
NERD_FONT_VERSION="v3.5.1"

# --- Live session -------------------------------------------------------------
LIVE_USERNAME="uwu"
LIVE_FULLNAME="UwUbuntu Live Pawtner"
LIVE_HOSTNAME="uwubuntu"

# --- Output -------------------------------------------------------------------
ISO_VOLUME_ID="UWUBUNTU_2604"
# xz is smallest; zstd builds much faster (good while iterating)
SQUASHFS_COMP="xz"
