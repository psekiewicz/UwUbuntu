      <ellipse cx="-40" cy="-14" rx="11" ry="15" transform="rotate(-20 -40 -14)"/>
      <ellipse cx="-15" cy="-38" rx="12" ry="16" transform="rotate(-6 -15 -38)"/>
      <ellipse cx="15" cy="-38" rx="12" ry="16" transform="rotate(6 15 -38)"/>
