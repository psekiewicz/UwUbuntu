    <polygon points="212,100 198,22 140,60" fill="#c77bff" stroke="#c77bff" stroke-width="14"/>
    <polygon points="62,86 67,46 98,66" fill="#ffd1ec" stroke="#ffd1ec" stroke-width="6"/>
    <polygon points="194,86 189,46 158,66" fill="#ffd1ec" stroke="#ffd1ec" stroke-width="6"/>
  </g>
  <circle cx="128" cy="148" r="100" fill="url(#fur)"/>
