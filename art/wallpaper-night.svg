<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="3840" height="2160">
  <!-- UwUbuntu placeholder wallpaper (dark): a trail of paw prints under the stars -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140b26"/>
      <stop offset="0.55" stop-color="#2b1446"/>
      <stop offset="1" stop-color="#5a1f63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#ff7ac8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7ac8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <g id="p">
      <path d="M0,-2 C20,-2 40,22 38,38 C36,54 20,54 0,48 C-20,54 -36,54 -38,38 C-40,22 -20,-2 0,-2Z"/>
      <ellipse cx="-40" cy="-14" rx="11" ry="15" transform="rotate(-20 -40 -14)"/>
      <ellipse cx="-15" cy="-38" rx="12" ry="16" transform="rotate(-6 -15 -38)"/>
      <ellipse cx="15" cy="-38" rx="12" ry="16" transform="rotate(6 15 -38)"/>
      <ellipse cx="40" cy="-14" rx="11" ry="15" transform="rotate(20 40 -14)"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- bokeh -->
  <g filter="url(#soft)">
    <circle cx="1480" cy="260" r="120" fill="#ff8fd0" opacity="0.18"/>
    <circle cx="300" cy="200" r="90" fill="#9b5cff" opacity="0.2"/>
    <circle cx="1700" cy="880" r="150" fill="#c77bff" opacity="0.14"/>
    <circle cx="600" cy="980" r="110" fill="#ff7ac8" opacity="0.12"/>
  </g>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.6" opacity="0.7"/>
    <circle cx="260" cy="340" r="1.2" opacity="0.5"/>
    <circle cx="410" cy="130" r="2.2" opacity="0.8"/>
    <circle cx="560" cy="260" r="1.3" opacity="0.5"/>
    <circle cx="700" cy="70" r="1.8" opacity="0.6"/>
    <circle cx="860" cy="200" r="1.1" opacity="0.4"/>
    <circle cx="980" cy="110" r="2" opacity="0.7"/>
    <circle cx="1120" cy="300" r="1.4" opacity="0.5"/>
    <circle cx="1260" cy="60" r="1.6" opacity="0.6"/>
    <circle cx="1390" cy="170" r="1.2" opacity="0.5"/>
    <circle cx="1580" cy="90" r="2.4" opacity="0.8"/>
    <circle cx="1760" cy="220" r="1.4" opacity="0.6"/>
    <circle cx="1860" cy="420" r="1.8" opacity="0.5"/>
    <circle cx="1690" cy="560" r="1.2" opacity="0.4"/>
    <circle cx="80" cy="520" r="1.5" opacity="0.5"/>
    <circle cx="200" cy="760" r="1.1" opacity="0.4"/>
    <circle cx="1240" cy="700" r="1.3" opacity="0.4"/>
    <circle cx="1440" cy="980" r="1.7" opacity="0.5"/>
    <circle cx="960" cy="900" r="1.2" opacity="0.35"/>
    <circle cx="380" cy="600" r="1.4" opacity="0.4"/>
  </g>
  <!-- sparkles -->
  <g fill="#ffc2e8">
    <path d="M0,-14 L3,-3 L14,0 L3,3 L0,14 L-3,3 L-14,0 L-3,-3Z" transform="translate(1180 160)" opacity="0.8"/>
    <path d="M0,-14 L3,-3 L14,0 L3,3 L0,14 L-3,3 L-14,0 L-3,-3Z" transform="translate(330 420) scale(0.7)" opacity="0.6"/>
    <path d="M0,-14 L3,-3 L14,0 L3,3 L0,14 L-3,3 L-14,0 L-3,-3Z" transform="translate(1800 640) scale(0.9)" opacity="0.6"/>
    <path d="M0,-14 L3,-3 L14,0 L3,3 L0,14 L-3,3 L-14,0 L-3,-3Z" transform="translate(760 360) scale(0.5)" opacity="0.5"/>
  </g>

  <!-- paw print trail, fading in as it walks up and to the right -->
  <g fill="#ffd1ec">
    <use href="#p" transform="translate(163.5 979) rotate(65) scale(0.55)" opacity="0.04"/>
    <use href="#p" transform="translate(272.5 857) rotate(65) scale(0.55)" opacity="0.055"/>
    <use href="#p" transform="translate(435.5 851) rotate(65) scale(0.55)" opacity="0.07"/>
    <use href="#p" transform="translate(544.5 729) rotate(65) scale(0.55)" opacity="0.085"/>
    <use href="#p" transform="translate(707.5 723) rotate(65) scale(0.55)" opacity="0.1"/>
    <use href="#p" transform="translate(816.5 601) rotate(65) scale(0.55)" opacity="0.115"/>
    <use href="#p" transform="translate(979.5 595) rotate(65) scale(0.55)" opacity="0.13"/>
    <use href="#p" transform="translate(1088.5 473) rotate(65) scale(0.55)" opacity="0.145"/>
    <use href="#p" transform="translate(1251.5 467) rotate(65) scale(0.55)" opacity="0.16"/>
    <use href="#p" transform="translate(1360.5 345) rotate(65) scale(0.55)" opacity="0.18"/>
    <use href="#p" transform="translate(1523.5 339) rotate(65) scale(0.55)" opacity="0.2"/>
    <use href="#p" transform="translate(1632.5 217) rotate(65) scale(0.55)" opacity="0.24"/>
  </g>
</svg>
