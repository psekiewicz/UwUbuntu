---
defaultGroups:
  - adm
  - cdrom
  - dip
  - lpadmin
  - plugdev
  - sudo
  - users
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false

passwordRequirements:
  minLength: 1
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root ]

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-uwubuntu"
  forbidden_names: [ localhost ]
