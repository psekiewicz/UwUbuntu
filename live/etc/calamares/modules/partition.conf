---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"

userSwapChoices:
  - none
  - file
initialSwapChoice: file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase   # like Ubuntu; Summary + a warning come before any change
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
enableLuksAutomatedPartitioning: true

# What "Erase disk" creates next to the EFI partition. Without this, the
# erase plan only had the EFI partition and nowhere to install to.
# "unknown" = use the filesystem picked on the page (default ext4).
partitionLayout:
  - name: "uwubuntu"
    filesystem: "unknown"
    mountPoint: "/"
    size: 100%
