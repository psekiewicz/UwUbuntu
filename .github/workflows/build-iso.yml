name: Build ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      # Build inside a real Ubuntu 26.04 userland so debootstrap, keyrings and
      # GRUB all match the release we're building.
      - name: Build
        run: sudo docker run --rm --privileged -v "$PWD:/src" -w /src ubuntu:26.04 bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: uwubuntu-iso
          path: out/
          compression-level: 0
          retention-days: 7
